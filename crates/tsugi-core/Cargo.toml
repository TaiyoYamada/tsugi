[package]
name = "tsugi-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The library behind tsugi, a layer on top of Git for parallel coding agents"

[dependencies]
notify = "8.2.2"
reflink-copy = "0.1.32"
rusqlite = { version = "0.42.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
toml = "1.2.1"
ts-rs = { version = "12.0.1", optional = true }

[dev-dependencies]
proptest = "1.12.0"
tempfile = "3.27.0"

[lints]
workspace = true

[features]
# Derives `ts_rs::TS` on the public types, for the TypeScript bindings of
# the desktop app (`pnpm bindings` in apps/desktop).
ts = ["dep:ts-rs"]
