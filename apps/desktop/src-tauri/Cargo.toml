[package]
name = "tsugi-desktop"
description = "The desktop app of tsugi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
# Tauri builds the app as a library for mobile targets; the name must differ
# from the binary.
name = "tsugi_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tsugi-core = { path = "../../../crates/tsugi-core", version = "0.1.0", features = ["ts"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
ts-rs = "12.0.1"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
serde_json = "1"
tempfile = "3.27.0"

[lints]
workspace = true
