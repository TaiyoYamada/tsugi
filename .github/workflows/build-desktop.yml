# Builds tsugi desktop, signed and notarized, for the release that dist makes.
# dist's host job attaches every artifact named artifacts-* to the release.
name: Build tsugi desktop

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

jobs:
  dmg:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/desktop/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Write the App Store Connect key for notarization
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: echo "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
      - name: Build
        env:
          APPLE_CERTIFICATE: ${{ secrets.CODESIGN_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.CODESIGN_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.CODESIGN_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
        run: pnpm tauri build --target universal-apple-darwin --bundles dmg
      # Tauri names the file after productName, which has a space. A fixed
      # name keeps releases/latest/download/<name> stable.
      - name: Rename
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          cp ../../target/universal-apple-darwin/release/bundle/dmg/*.dmg "$RUNNER_TEMP/out/tsugi-desktop-universal-apple-darwin.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: artifacts-build-desktop
          path: ${{ runner.temp }}/out/tsugi-desktop-universal-apple-darwin.dmg
