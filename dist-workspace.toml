[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.34.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu"]
# Build only the packages that are shipped; tsugi desktop needs GTK on Linux
precise-builds = true
# Where to host releases
hosting = "github"
# Sign the macOS binaries with the Developer ID certificate in CODESIGN_CERTIFICATE
macos-sign = true
# tsugi desktop is built by its own job and its .dmg is added to the release
local-artifacts-jobs = ["./build-desktop"]
